<!DOCTYPE html>
<!--
  SIAMESE ELEPHANTS HOMEPAGE
  Sections you can edit by hand: ANNOUNCEMENTS, SHOWS, DISCOGRAPHY, MERCH.
  Each has a template block marked "COPY ME". Search for "EDIT" to jump between them.
  Images: replace any src="data:image/svg+xml..." placeholder with a file or URL, e.g. src="covers/white-flag.jpg".
-->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siamese Elephants</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b100d;--card:#1b251e;--card2:#26332a;--green:#505a4f;--beige:#e9dfc8;--mut:#e6e5e8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--beige);font:16px/1.55 "DM Sans",system-ui,sans-serif}
main{grid-template-columns:minmax(0,1fr)}
.card{min-width:0}
.quotes{touch-action:pan-y}
html,body{overflow-x:clip}
a{color:inherit;text-decoration:none}
.wrap{max-width:620px;margin:0 auto}
.hero{position:relative;background:var(--green)}
.hero img{display:block;width:100%;height:auto;max-height:520px;object-fit:cover;object-position:top}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,16,13,.15) 0,transparent 25%,rgba(11,16,13,.55) 70%,var(--bg) 100%)}
.credit{position:absolute;right:10px;top:8px;z-index:2;font-size:8px;color:rgba(233,223,200,.5)}
.head{position:relative;z-index:1;margin-top:-150px;text-align:center;padding:0 20px 8px}
h1{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:clamp(40px,10vw,60px);line-height:1;margin:0}
.logo{margin:0;line-height:0}
.logo img{display:block;margin:0 auto;width:min(100%,340px);max-width:100%;height:auto;max-height:140px;object-fit:contain}
.sub{margin:10px 0 18px;color:var(--mut)}
.icons{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.icons a{opacity:.92;transition:.15s}.icons a:hover{opacity:1;transform:translateY(-2px);color:#fff}
main{padding:24px 16px 8px;display:grid;gap:14px}
.card{background:var(--card);border-radius:18px;padding:22px}
.card h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0 0 14px;font-weight:500}
.feature{background:var(--beige);color:#141a15}
.feature h2{color:#4b5448}
.feature .t{font-family:"DM Serif Display",Georgia,serif;font-size:clamp(34px,8vw,48px);line-height:1}
.feature p{margin:6px 0 18px}
.btn{display:inline-block;background:#141a15;color:var(--beige);padding:11px 20px;border-radius:99px;font-weight:700;font-size:14px;white-space:nowrap}
.btn.o{background:transparent;border:1.5px solid var(--beige);padding:9.5px 18.5px}
.btn.s{padding:8px 15px;font-size:13px;background:var(--beige);color:#141a15}
.btn:hover{opacity:.85}
.m{color:var(--mut);margin:0 0 14px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--card2)}
.list li:first-child{border-top:0;padding-top:0}
.list li:hover{color:#fff}.list span{color:var(--mut)}
.qview{overflow:hidden}
.qtrack{display:flex;transition:transform .6s ease}
.qslide{flex:0 0 100%;margin:0;padding:0 2px}
.qslide blockquote{margin:0;font-family:"DM Serif Display",Georgia,serif;font-size:clamp(20px,5vw,26px);line-height:1.3}
.qslide figcaption{margin-top:12px;color:var(--mut);font-size:14px}
.qslide figcaption a{text-decoration:underline}
.qdots{display:flex;gap:8px;justify-content:center;margin-top:16px}
.qdots button{width:8px;height:8px;padding:0;border:0;border-radius:50%;background:var(--card2);cursor:pointer}
.qdots button[aria-current="true"]{background:var(--beige)}
@media (prefers-reduced-motion:reduce){.qtrack{transition:none}}
/* announcements */
.ann{border-left:3px solid var(--beige);padding:2px 0 2px 14px;margin-bottom:18px}
.ann:last-child{margin-bottom:0}
.ann time{font-size:12px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}

#news-list{max-height:260px;overflow-y:auto;overscroll-behavior:contain;padding-right:8px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--card2) transparent}

.show:first-of-type{border-top:0;padding-top:0}
.show .d{background:var(--card2);border-radius:12px;text-align:center;padding:7px 0;line-height:1.1}
.show .d b{display:block;font-size:22px}.show .d span{font-size:11px;letter-spacing:.1em;color:var(--mut)}
.show .w b{display:block}.show .w span{color:var(--mut);font-size:14px}
.show .w em{display:block;font-style:normal;font-size:13px;color:var(--beige);opacity:.75;margin-top:2px}
.show.sold .btn{background:transparent;color:var(--mut);border:1.5px solid var(--card2);pointer-events:none}
/* image grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.tile{display:block}
.tile img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--card2);transition:.15s}
.tile:hover img{transform:translateY(-3px);opacity:.92}
.tile b{display:block;margin-top:8px;font-size:15px;line-height:1.3}
.tile small{color:var(--mut)}
.tile .ph{aspect-ratio:1;border-radius:12px;background:var(--card2);display:grid;place-items:center;color:var(--mut);font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:.15s}
.tile:hover .ph{transform:translateY(-3px);opacity:.92}
#merch-list .tile{text-align:center}
#merch-list{overflow:hidden;padding-top:4px;margin-top:-4px;transition:max-height .4s ease}
#merch-toggle{display:block;margin:16px auto 0;font:inherit;font-weight:700;font-size:14px;color:var(--beige);cursor:pointer}
#merch-toggle[hidden]{display:none}
@media (prefers-reduced-motion:reduce){#merch-list{transition:none}}
footer{text-align:center;color:var(--mut);font-size:13px;padding:28px 20px 40px}
/* youtube feature */
.video{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--card2)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vtitle{margin:12px 0 0;color:var(--mut);font-size:14px}
/* floating section nav */
.jump{position:fixed;left:0;right:0;margin-inline:auto;width:max-content;max-width:calc(100% - 24px);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:4px;padding:5px;border-radius:99px;background:rgba(27,37,30,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--card2);box-shadow:0 6px 24px rgba(0,0,0,.45);overflow-x:auto;scrollbar-width:none;opacity:0;pointer-events:none;transform:translateY(16px);transition:opacity .25s,transform .25s}
.jump::-webkit-scrollbar{display:none}
.jump.on{opacity:1;pointer-events:auto;transform:none}
.jump a{flex:none;padding:10px 14px;border-radius:99px;font-size:13px;font-weight:500;color:var(--mut);transition:background .2s,color .2s}
.jump a.act{background:var(--beige);color:#141a15}
.jump a[hidden]{display:none}
footer{padding-bottom:96px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.jump{transition:none}}
</style></head><body><div class="wrap">

<main>

<section class="card" id="news" hidden><h2>Announcements</h2>
  <div id="news-list"></div>
</section>

<script>
(async () => {
  const box = document.getElementById("news-list");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const toDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  try {
    const r = await fetch("config/announcements.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    const items = (await r.json())
      .map(a => ({ ...a, _d: a.date ? toDate(a.date) : null }))
      .sort((a, b) => (b._d || 0) - (a._d || 0));
    if (!items.length) return; // section stays hidden

    box.innerHTML = items.map(a => {
      const when = a._d
        ? `<time datetime="${esc(a.date)}">${a._d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })}</time>`
        : "";
      const link = a.link
        ? ` <a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.linkText || "Read more →")}</a>`
        : "";
      return `<article class="ann">${when}<h3>${esc(a.title)}</h3><p>${esc(a.text)}${link}</p></article>`;
    }).join("");
    document.getElementById("news").hidden = false;
  } catch (err) { /* leave hidden if the file is missing or broken */ }
})();
</script>

<!-- ===== SHOWS ===== -->
<section class="card" id="shows"><h2>Shows</h2>
  <div id="shows-list"><p class="m">Loading shows…</p></div>
</section>
<script>
(async () => {
  const box = document.getElementById("shows-list");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const empty = '<p class="m">No upcoming shows right now. Follow along for new dates.</p>';
  try {
    const r = await fetch("config/shows.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    const all = await r.json();

    // Parse "YYYY-MM-DD" as a local date so it never shifts by a day
    const toDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
    const today = new Date(); today.setHours(0, 0, 0, 0);

    const shows = all
      .map(s => ({ ...s, _d: toDate(s.date) }))
      .filter(s => s._d >= today)
      .sort((a, b) => a._d - b._d);

    if (!shows.length) { box.innerHTML = empty; return; }

    box.innerHTML = shows.map(s => {
      const mon = s._d.toLocaleString("en", { month: "short" }).toUpperCase();
      const btn = s.tickets
        ? `<a class="btn s" href="${esc(s.tickets)}" target="_blank" rel="noopener">${s.soldOut ? "Sold out" : "Tickets"}</a>`
        : "";
      return `<div class="show${s.soldOut ? " sold" : ""}">
        <div class="d"><b>${s._d.getDate()}</b><span>${mon}</span></div>
        <div class="w"><b>${esc(s.city)}, ${esc(s.country)}</b><span>${esc(s.venue)}</span></div>
        ${btn}
      </div>`;
    }).join("");
  } catch (err) {
    box.innerHTML = '<p class="m">Couldn\'t load shows right now.</p>';
  }
})();
</script>

<section class="card" id="featured" hidden><h2>Featured video</h2>
  <div class="video"></div>
  <p class="vtitle"></p>
</section>

<script>
(async () => {
  const card = document.getElementById("featured");
  try {
    const r = await fetch("config/featured.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    const f = await r.json();
    if (!f.youtubeId || !/^[\w-]{11}$/.test(f.youtubeId)) return; // stays hidden

    card.querySelector("h2").textContent = f.label || "Featured video";
    const ifr = document.createElement("iframe");
    ifr.src = "https://www.youtube-nocookie.com/embed/" + f.youtubeId + "?rel=0";
    ifr.title = f.title || "Featured video";
    ifr.loading = "lazy";
    ifr.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    ifr.allowFullscreen = true;
    ifr.referrerPolicy = "strict-origin-when-cross-origin";
    card.querySelector(".video").appendChild(ifr);
    card.querySelector(".vtitle").textContent = f.title || "";
    card.hidden = false;
  } catch (err) { /* leave the card hidden if anything fails */ }
})();
</script>

<section class="card quotes" id="quotes" hidden aria-label="Press quotes">
  <div class="qview"><div class="qtrack"></div></div>
  <div class="qdots"></div>
</section>
<script>
(async () => {
  const card = document.getElementById("quotes");
  const track = card.querySelector(".qtrack");
  const dots = card.querySelector(".qdots");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const INTERVAL = 6000; // ms per quote
  try {
    const r = await fetch("config/quotes.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    const items = await r.json();
    if (!items.length) return; // stays hidden

    track.innerHTML = items.map(q => {
      const src = q.url
        ? `<a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.source)}</a>`
        : esc(q.source);
      return `<figure class="qslide"><blockquote>“${esc(q.text)}”</blockquote><figcaption>${src}${q.year ? ", " + esc(q.year) : ""}</figcaption></figure>`;
    }).join("");
    card.hidden = false;

    let i = 0, timer = null;
    const go = n => {
      i = (n + items.length) % items.length;
      track.style.transform = `translateX(-${i * 100}%)`;
      [...dots.children].forEach((d, k) => d.setAttribute("aria-current", k === i));
    };

    if (items.length > 1) {
      dots.innerHTML = items.map((_, k) => `<button type="button" aria-label="Quote ${k + 1}"></button>`).join("");
      dots.addEventListener("click", e => {
        const k = [...dots.children].indexOf(e.target.closest("button"));
        if (k >= 0) { go(k); restart(); }
      });

      const start = () => { timer = setInterval(() => go(i + 1), INTERVAL); };
      const stop = () => { clearInterval(timer); timer = null; };
      const restart = () => { stop(); start(); };
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (!reduce) {
        start();
        card.addEventListener("mouseenter", stop);
        card.addEventListener("mouseleave", start);
        card.addEventListener("focusin", stop);
        card.addEventListener("focusout", start);
      }

      // swipe on touch screens
      let x0 = null;
      card.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
      card.addEventListener("touchend", e => {
        if (x0 === null) return;
        const dx = e.changedTouches[0].clientX - x0;
        x0 = null;
        if (Math.abs(dx) > 40) { go(i + (dx < 0 ? 1 : -1)); if (!reduce) restart(); }
      });
    }
    go(0);
  } catch (err) { /* leave hidden if anything fails */ }
})();
</script>

<section class="card" id="merch" hidden><h2>Merch</h2>
  <div class="grid" id="merch-list"></div>
  <button class="btn o" id="merch-toggle" type="button" aria-expanded="false" aria-controls="merch-list" hidden>View more</button>
  <p id="merch-shops" style="margin:18px 0 0;display:flex;flex-wrap:wrap;gap:10px"></p>
</section>

<script>
(async () => {
  const grid = document.getElementById("merch-list");
  const shopsBox = document.getElementById("merch-shops");
  const toggle = document.getElementById("merch-toggle");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  try {
    const r = await fetch("config/merch.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const items = data.items || [];
    const shops = data.shops || [];
    if (!items.length && !shops.length) return; // section stays hidden

    grid.innerHTML = items.map(p => {
      const pic = p.image
        ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`
        : `<div class="ph">Product</div>`;
      return `<a class="tile" href="${esc(p.url)}" target="_blank" rel="noopener">${pic}<b>${esc(p.name)}</b>${p.price ? `<small>${esc(p.price)}</small>` : ""}</a>`;
    }).join("");
    grid.hidden = !items.length;

    shopsBox.innerHTML = shops.map(s =>
      `<a class="btn o" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`
    ).join("");
    shopsBox.hidden = !shops.length;

    document.getElementById("merch").hidden = false;

    // foldable: show only the first row until "View more" is tapped
    let open = false;
    const measure = () => {
      const tiles = [...grid.children];
      if (!tiles.length) return;
      const rects = tiles.map(t => t.getBoundingClientRect());
      const gridTop = grid.getBoundingClientRect().top;
      const firstTop = rects[0].top;
      const rowEnd = Math.max(...rects.filter(x => Math.abs(x.top - firstTop) < 2).map(x => x.bottom)) - gridTop;
      const needsFold = grid.scrollHeight > rowEnd + 2;
      toggle.hidden = !needsFold;
      grid.style.maxHeight = needsFold && !open ? rowEnd + "px" : grid.scrollHeight + "px";
    };
    toggle.addEventListener("click", () => {
      open = !open;
      toggle.textContent = open ? "View less" : "View more";
      toggle.setAttribute("aria-expanded", open);
      measure();
      if (!open) document.getElementById("merch").scrollIntoView({ block: "nearest", behavior: "smooth" });
    });
    addEventListener("resize", measure);
    if (document.fonts) document.fonts.ready.then(measure);
    measure();
  } catch (err) { /* leave hidden if the file is missing or broken */ }
})();
</script>

<section class="card" id="press"><h2>Press</h2>
  <ul class="list" id="press-list"><li>Loading…</li></ul>
</section>

<script>
(async () => {
  const list = document.getElementById("press-list");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  try {
    const r = await fetch("config/press.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    const items = (await r.json()).sort((a, b) => (b.year || 0) - (a.year || 0));
    if (!items.length) { list.innerHTML = '<li class="m">No press yet.</li>'; return; }
    list.innerHTML = items.map(p => {
      const meta = [p.year, p.lang].filter(Boolean).join(", ");
      return `<li><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}${meta ? ` (${esc(meta)})` : ""}</a><span>↗</span></li>`;
    }).join("");
  } catch (err) {
    list.innerHTML = '<li class="m">Couldn\'t load press right now.</li>';
  }
})();
</script>

<script>
(() => {
  const items = [["news","News"],["shows","Shows"],["music","Music"],["merch","Merch"],["videos","Videos"],["press","Press"],["contact","Booking"]];
  const nav = document.createElement("nav");
  nav.className = "jump";
  nav.setAttribute("aria-label", "Jump to section");
  nav.innerHTML = '<a href="#" data-top aria-label="Back to top">↑ Top</a>' +
    items.map(([id, l]) => `<a href="#${id}" data-id="${id}">${l}</a>`).join("");
  document.body.appendChild(nav);

  const hero = document.querySelector(".hero");
  const chips = [...nav.querySelectorAll("[data-id]")];
  const secs = items.map(([id]) => document.getElementById(id));
  let last = null, ticking = false;

  // hide chips for sections that are hidden (e.g. empty JSON)
  const sync = () => chips.forEach(a => { a.hidden = document.getElementById(a.dataset.id).hidden; });
  new MutationObserver(sync).observe(document.querySelector("main"), { attributes: true, attributeFilter: ["hidden"], subtree: true });
  sync();

  nav.querySelector("[data-top]").addEventListener("click", e => {
    e.preventDefault();
    scrollTo({ top: 0, behavior: "smooth" });
  });

  const update = () => {
    ticking = false;
    nav.classList.toggle("on", hero.getBoundingClientRect().bottom < 0);

    let cur = null;
    secs.forEach(s => { if (!s.hidden && s.getBoundingClientRect().top <= innerHeight * 0.4) cur = s.id; });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) {
      const vis = secs.filter(s => !s.hidden);
      if (vis.length) cur = vis[vis.length - 1].id;   // at the very bottom: last section
    }
    if (cur === last) return;
    last = cur;
    chips.forEach(a => {
      const on = a.dataset.id === cur;
      a.classList.toggle("act", on);
      if (on) nav.scrollTo({ left: a.offsetLeft - nav.clientWidth / 2 + a.offsetWidth / 2, behavior: "smooth" });
    });
  };
  const req = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
  addEventListener("scroll", req, { passive: true });
  addEventListener("resize", req);
  update();
})();
</script>
