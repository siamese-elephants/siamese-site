<!DOCTYPE html>
<!--
  SIAMESE ELEPHANTS HOMEPAGE
  All content lives in config/*.json:
  announcements, shows, featured, quotes, discography, merch, videos, press, theme.
  Press is the only section whose script has a visible "empty" message; the rest hide themselves when empty.
-->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siamese Elephants</title>
<link rel="canonical" href="https://siamese-elephants.com/">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b100d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b100d;--card:#1b251e;--card2:#26332a;--green:#505a4f;--beige:#e9dfc8;--mut:#e6e5e8;--ink:#141a15;--ink2:#4b5448;--soft:#cfc7b0;--hover:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--beige);font:16px/1.55 "DM Sans",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:620px;margin:0 auto}
.hero{position:relative;background:var(--green)}
.hero img{display:block;width:100%;height:auto;max-height:520px;object-fit:cover;object-position:top}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 15%,transparent) 0,transparent 25%,color-mix(in srgb,var(--bg) 55%,transparent) 70%,var(--bg) 100%)}
.credit{position:absolute;left:10px;top:8px;z-index:2;font-size:8px;color:color-mix(in srgb,var(--beige) 50%,transparent)}
.head{position:relative;z-index:1;margin-top:-150px;text-align:center;padding:0 20px 8px}
.logo{margin:0;line-height:0}
.logo img{display:block;margin:0 auto;width:min(100%,340px);max-width:100%;height:auto;max-height:140px;object-fit:contain}
.sub{margin:10px 0 18px;color:var(--mut)}
.icons{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.icons a{opacity:.92;transition:.15s}
.icons a:hover{opacity:1;transform:translateY(-2px);color:var(--hover)}
main{padding:24px 16px 8px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.card{min-width:0;background:var(--card);border-radius:18px;padding:22px}
.card h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0 0 14px;font-weight:500}
.feature{background:var(--beige);color:var(--ink)}
.feature h2{color:var(--ink2)}
.feature .t{font-family:"DM Serif Display",Georgia,serif;font-size:clamp(34px,8vw,48px);line-height:1}
.feature p{margin:6px 0 18px}
.btn{display:inline-block;background:var(--ink);color:var(--beige);padding:11px 20px;border-radius:99px;font-weight:700;font-size:14px;white-space:nowrap}
.btn.o{background:transparent;border:1.5px solid var(--beige);padding:9.5px 18.5px}
.btn.s{padding:8px 15px;font-size:13px;background:var(--beige);color:var(--ink)}
.btn:hover{opacity:.85}
.m{color:var(--mut);margin:0 0 14px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--card2)}
.list li:first-child{border-top:0;padding-top:0}
.list li:hover{color:var(--hover)}
.list span{color:var(--mut)}
/* quotes */
.quotes{touch-action:pan-y}
.qview{overflow:hidden}
.qtrack{display:flex;transition:transform .6s ease}
.qslide{flex:0 0 100%;margin:0;padding:0 2px}
.qslide blockquote{margin:0;font-family:"DM Serif Display",Georgia,serif;font-size:clamp(20px,5vw,26px);line-height:1.3}
.qslide.md blockquote{font-size:clamp(17px,4.2vw,21px)}
.qslide.lg blockquote{font-size:clamp(15px,3.6vw,18px);line-height:1.35}
.qslide figcaption{margin-top:12px;color:var(--mut);font-size:14px}
.qslide figcaption a{text-decoration:underline}
.qdots{display:flex;gap:8px;justify-content:center;margin-top:16px}
.qdots button{width:8px;height:8px;padding:0;border:0;border-radius:50%;background:var(--card2);cursor:pointer}
.qdots button[aria-current="true"]{background:var(--beige)}
/* announcements */
.ann{border-left:3px solid var(--beige);padding:2px 0 2px 14px;margin-bottom:18px}
.ann:last-child{margin-bottom:0}
.ann time{font-size:12px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.ann h3{margin:2px 0 4px;font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:22px}
.ann p{margin:0;color:var(--soft)}
.ann p a{text-decoration:underline}
#news-list{max-height:260px;overflow-y:auto;overscroll-behavior:contain;padding-right:8px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--card2) transparent}
#news-list::-webkit-scrollbar{width:6px}
#news-list::-webkit-scrollbar-thumb{background:var(--card2);border-radius:3px}
/* shows */
.show{display:grid;grid-template-columns:58px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--card2)}
.show:first-of-type{border-top:0;padding-top:0}
.show .d{background:var(--card2);border-radius:12px;text-align:center;padding:7px 0;line-height:1.1}
.show .d b{display:block;font-size:22px}
.show .d span{font-size:11px;letter-spacing:.1em;color:var(--mut)}
.show .w b{display:block}
.show .w span{color:var(--mut);font-size:14px}
.show .w em{display:block;font-style:normal;font-size:13px;color:var(--beige);opacity:.75;margin-top:2px}
.show.sold .btn{background:transparent;color:var(--mut);border:1.5px solid var(--card2);pointer-events:none}
/* image grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.tile{display:block}
.tile img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--card2);transition:.15s}
.tile:hover img{transform:translateY(-3px);opacity:.92}
.tile b{display:block;margin-top:8px;font-size:15px;line-height:1.3}
.tile small{color:var(--mut)}
.tile .ph{aspect-ratio:1;border-radius:12px;background:var(--card2);display:grid;place-items:center;color:var(--mut);font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:.15s}
.tile:hover .ph{transform:translateY(-3px);opacity:.92}
#merch-list .tile{text-align:center}
/* foldable merch */
.fold{position:relative}
.fold #merch-list{overflow:hidden;padding-top:4px;margin-top:-4px;transition:max-height .45s ease}
.fold::after{content:"";position:absolute;left:0;right:0;bottom:0;height:72px;background:linear-gradient(to bottom,color-mix(in srgb,var(--card) 0%,transparent),var(--card) 85%);pointer-events:none;transition:opacity .3s}
.fold.open::after{opacity:0}
.more{display:flex;align-items:center;gap:14px;width:100%;margin:6px 0 0;padding:10px 0;background:none;border:0;font:inherit;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);cursor:pointer;transition:color .2s}
.more:hover,.more:focus-visible{color:var(--beige)}
.more::before,.more::after{content:"";flex:1;height:1px;background:var(--card2)}
.more svg{width:12px;height:12px;margin-left:6px;vertical-align:-1px;transition:transform .3s}
.more[aria-expanded="true"] svg{transform:rotate(180deg)}
.more[hidden]{display:none}
/* youtube feature */
.video{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--card2)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vtitle{margin:12px 0 0;color:var(--mut);font-size:14px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:28px 20px 96px}
/* floating section nav */
.jump{position:fixed;left:0;right:0;margin-inline:auto;width:max-content;max-width:calc(100% - 24px);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:4px;padding:5px;border-radius:99px;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--card2);box-shadow:0 6px 24px rgba(0,0,0,.45);overflow-x:auto;scrollbar-width:none;opacity:0;pointer-events:none;transform:translateY(16px);transition:opacity .25s,transform .25s}
.jump::-webkit-scrollbar{display:none}
.jump.on{opacity:1;pointer-events:auto;transform:none}
.jump a{flex:none;padding:10px 14px;border-radius:99px;font-size:13px;font-weight:500;color:var(--mut);transition:background .2s,color .2s}
.jump a.act{background:var(--beige);color:var(--ink)}
.jump a[hidden]{display:none}
/* burger menu */
.burger{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,calc((100vw - 620px)/2 + 12px));z-index:60;width:44px;height:44px;padding:0;border-radius:50%;border:1px solid var(--card2);background:color-mix(in srgb,var(--card) 35%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--beige);cursor:pointer;display:grid;place-items:center}
.burger span{grid-area:1/1;width:18px;height:2px;border-radius:2px;background:currentColor;transition:transform .25s,opacity .2s}
.burger span:nth-child(1){transform:translateY(-6px)}
.burger span:nth-child(3){transform:translateY(6px)}
.burger[aria-expanded="true"] span:nth-child(1){transform:rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:rotate(-45deg)}
.menu{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:max(12px,calc((100vw - 620px)/2 + 12px));z-index:60;width:min(240px,calc(100vw - 24px));padding:8px;border-radius:18px;background:var(--card);border:1px solid var(--card2);box-shadow:0 12px 36px rgba(0,0,0,.5);transform-origin:top right;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transition:opacity .2s,transform .2s,visibility .2s}
.menu.open{opacity:1;visibility:visible;transform:none}
.menu a{display:block;padding:12px 14px;border-radius:12px;font-weight:500;color:var(--beige)}
.menu a:hover,.menu a:focus-visible{background:var(--card2);outline:0}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .qtrack,.fold #merch-list,.fold::after,.more svg,.jump,.burger span,.menu{transition:none}
}
</style>

<!-- shared helpers + color theme (config/theme.json) -->
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
(() => {
  const MAP = {background:"--bg",card:"--card",cardAlt:"--card2",hero:"--green",accent:"--beige",muted:"--mut",ink:"--ink",inkSoft:"--ink2",softText:"--soft",hover:"--hover"};
  const root = document.documentElement;
  const apply = t => {
    for (const [key, cssVar] of Object.entries(MAP)) {
      const v = t[key];
      if (v && CSS.supports("color", v)) root.style.setProperty(cssVar, v);
      else root.style.removeProperty(cssVar);
    }
    if (t.background) document.querySelector('meta[name="theme-color"]')?.setAttribute("content", t.background);
  };
  try { const c = localStorage.getItem("se-theme"); if (c) apply(JSON.parse(c)); } catch (e) {}
  fetch("config/theme.json", { cache: "no-cache" })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(t => { apply(t); try { localStorage.setItem("se-theme", JSON.stringify(t)); } catch (e) {} })
    .catch(() => {});
})();
</script>
</head><body><div class="wrap">

<div class="hero"><img src="img/SE_hero.jpg" alt="Siamese Elephants, four band members standing on an escalator platform"><span class="credit">Photo: Paul Vincenth Schuetz</span></div>
<div class="head"><h1 class="logo"><img src="img/logo.png" alt="Siamese Elephants" width="800" height="300"></h1><p class="sub">welcome to the doomscroller club</p><div class="icons"><a href="https://siamese-elephants.bandcamp.com/music" aria-label="Bandcamp"><img src="icons/bandcamp.png" alt="Bandcamp" width="26" height="26" style="display:block;object-fit:contain"></a><a href="https://open.spotify.com/artist/7bgOhFs7p8ZGBMIIORey80" aria-label="Spotify"><img src="icons/spotify.png" alt="Spotify" width="26" height="26" style="display:block;object-fit:contain"></a><a href="https://music.apple.com/at/artist/siamese-elephants/1465891720" aria-label="Apple Music"><img src="icons/apple-music.png" alt="Apple Music" width="26" height="26" style="display:block;object-fit:contain"></a><a href="https://www.instagram.com/siamese.elephants" aria-label="Instagram"><img src="icons/instagram.png" alt="Instagram" width="26" height="26" style="display:block;object-fit:contain"></a><a href="https://www.tiktok.com/@siamese.elephants" aria-label="TikTok"><img src="icons/tiktok.png" alt="TikTokToxic" width="26" height="26" style="display:block;object-fit:contain"></a><a href="https://youtu.be/UPX9JvmRYZw" aria-label="YouTube"><img src="icons/youtube.png" alt="Youtube" width="26" height="26" style="display:block;object-fit:contain"></a><a href="#contact" aria-label="Email"><img src="icons/mail.png" alt="Mail" width="26" height="26" style="display:block;object-fit:contain"></a></div></div>

<main>

<!-- ===== ANNOUNCEMENTS (config/announcements.json) ===== -->
<section class="card" id="news" hidden><h2>Announcements</h2>
  <div id="news-list"></div>
</section>
<script>
(async () => {
  const box = document.getElementById("news-list");
  try {
    const r = await fetch("config/announcements.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    const items = (await r.json())
      .map(a => ({ ...a, _d: a.date ? toDate(a.date) : null }))
      .sort((a, b) => (b._d || 0) - (a._d || 0));
    if (!items.length) return;
    box.innerHTML = items.map(a => {
      const when = a._d
        ? `<time datetime="${esc(a.date)}">${a._d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })}</time>`
        : "";
      const link = a.link
        ? ` <a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.linkText || "Read more →")}</a>`
        : "";
      return `<article class="ann">${when}<h3>${esc(a.title)}</h3><p>${esc(a.text)}${link}</p></article>`;
    }).join("");
    document.getElementById("news").hidden = false;
  } catch (err) {}
})();
</script>

<!-- ===== SHOWS (config/shows.json) ===== -->
<section class="card" id="shows"><h2>Shows</h2>
  <div id="shows-list"><p class="m">Loading shows…</p></div>
</section>
<script>
(async () => {
  const box = document.getElementById("shows-list");
  const empty = '<p class="m">No upcoming shows right now. Follow along for new dates.</p>';
  try {
    const r = await fetch("config/shows.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const shows = (await r.json())
      .map(s => ({ ...s, _d: toDate(s.date) }))
      .filter(s => s._d >= today)
      .sort((a, b) => a._d - b._d);
    if (!shows.length) { box.innerHTML = empty; return; }
    box.innerHTML = shows.map(s => {
      const mon = s._d.toLocaleString("en", { month: "short" }).toUpperCase();
      const btn = s.tickets
        ? `<a class="btn s" href="${esc(s.tickets)}" target="_blank" rel="noopener">${s.soldOut ? "Sold out" : "Tickets"}</a>`
        : "";
      return `<div class="show${s.soldOut ? " sold" : ""}">
        <div class="d"><b>${s._d.getDate()}</b><span>${mon}</span></div>
        <div class="w"><b>${esc(s.city)}, ${esc(s.country)}</b><span>${esc(s.venue)}</span>${s.note ? `<em>${esc(s.note)}</em>` : ""}</div>
        ${btn}
      </div>`;
    }).join("");
  } catch (err) {
    box.innerHTML = '<p class="m">Couldn\'t load shows right now.</p>';
  }
})();
</script>

<!-- ===== FEATURED VIDEO (config/featured.json) ===== -->
<section class="card" id="featured" hidden><h2>Featured video</h2>
  <div class="video"></div>
  <p class="vtitle"></p>
</section>
<script>
(async () => {
  const card = document.getElementById("featured");
  try {
    const r = await fetch("config/featured.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    const f = await r.json();
    if (!f.youtubeId || !/^[\w-]{11}$/.test(f.youtubeId)) return;
    card.querySelector("h2").textContent = f.label || "Featured video";
    const ifr = document.createElement("iframe");
    ifr.src = "https://www.youtube-nocookie.com/embed/" + f.youtubeId + "?rel=0";
    ifr.title = f.title || "Featured video";
    ifr.loading = "lazy";
    ifr.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    ifr.allowFullscreen = true;
    ifr.referrerPolicy = "strict-origin-when-cross-origin";
    card.querySelector(".video").appendChild(ifr);
    card.querySelector(".vtitle").textContent = f.title || "";
    card.hidden = false;
  } catch (err) {}
})();
</script>

<!-- ===== PRESS QUOTES (config/quotes.json) ===== -->
<section class="card quotes" id="quotes" hidden aria-label="Press quotes">
  <div class="qview"><div class="qtrack"></div></div>
  <div class="qdots"></div>
</section>
<script>
(async () => {
  const card = document.getElementById("quotes");
  const track = card.querySelector(".qtrack");
  const dots = card.querySelector(".qdots");
  const INTERVAL = 6000;
  try {
    const r = await fetch("config/quotes.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    const items = await r.json();
    if (!items.length) return;

    track.innerHTML = items.map(q => {
      const src = q.url
        ? `<a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.source)}</a>`
        : esc(q.source);
      const n = q.text.length, size = n > 220 ? "lg" : n > 120 ? "md" : "";
      return `<figure class="qslide ${size}"><blockquote>“${esc(q.text)}”</blockquote><figcaption>${src}${q.year ? ", " + esc(q.year) : ""}</figcaption></figure>`;
    }).join("");
    card.hidden = false;

    let i = 0, timer = null;
    const go = n => {
      i = (n + items.length) % items.length;
      track.style.transform = `translateX(-${i * 100}%)`;
      [...dots.children].forEach((d, k) => d.setAttribute("aria-current", k === i));
    };

    if (items.length > 1) {
      dots.innerHTML = items.map((_, k) => `<button type="button" aria-label="Quote ${k + 1}"></button>`).join("");
      const start = () => { timer = setInterval(() => go(i + 1), INTERVAL); };
      const stop = () => { clearInterval(timer); timer = null; };
      const restart = () => { stop(); start(); };
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

      dots.addEventListener("click", e => {
        const k = [...dots.children].indexOf(e.target.closest("button"));
        if (k >= 0) { go(k); if (!reduce) restart(); }
      });
      if (!reduce) {
        start();
        card.addEventListener("mouseenter", stop);
        card.addEventListener("mouseleave", start);
        card.addEventListener("focusin", stop);
        card.addEventListener("focusout", start);
      }

      let x0 = null;
      card.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
      card.addEventListener("touchend", e => {
        if (x0 === null) return;
        const dx = e.changedTouches[0].clientX - x0;
        x0 = null;
        if (Math.abs(dx) > 40) { go(i + (dx < 0 ? 1 : -1)); if (!reduce) restart(); }
      });
    }
    go(0);
  } catch (err) {}
})();
</script>

<!-- ===== DISCOGRAPHY (config/discography.json) ===== -->
<section class="card" id="music" hidden><h2>Discography</h2>
  <div class="grid" id="music-list"></div>
</section>
<script>
(async () => {
  const grid = document.getElementById("music-list");
  try {
    const r = await fetch("config/discography.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    const items = await r.json();
    if (!items.length) return;
    grid.innerHTML = items.map(d => {
      const meta = [d.type, d.year].filter(Boolean).join(" · ");
      const pic = d.cover
        ? `<img src="${esc(d.cover)}" alt="${esc(d.title)} cover" loading="lazy">`
        : `<div class="ph">Cover</div>`;
      return `<a class="tile" href="${esc(d.url)}" target="_blank" rel="noopener">${pic}<b>${esc(d.title)}</b>${meta ? `<small>${esc(meta)}</small>` : ""}</a>`;
    }).join("");
    document.getElementById("music").hidden = false;
  } catch (err) {}
})();
</script>

<!-- ===== MERCH (config/merch.json) ===== -->
<section class="card" id="merch" hidden><h2>Merch</h2>
  <div class="fold" id="merch-fold"><div class="grid" id="merch-list"></div></div>
  <button class="more" id="merch-toggle" type="button" aria-expanded="false" aria-controls="merch-list" hidden>
    <span>Show more</span>
    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.5 6 8.5l4-4"/></svg>
  </button>
  <p id="merch-shops" style="margin:18px 0 0;display:flex;flex-wrap:wrap;gap:10px"></p>
</section>
<script>
(async () => {
  const grid = document.getElementById("merch-list");
  const fold = document.getElementById("merch-fold");
  const shopsBox = document.getElementById("merch-shops");
  const toggle = document.getElementById("merch-toggle");
  const label = toggle.querySelector("span");
  try {
    const r = await fetch("config/merch.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const items = data.items || [];
    const shops = data.shops || [];
    if (!items.length && !shops.length) return;

    grid.innerHTML = items.map(p => {
      const pic = p.image
        ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`
        : `<div class="ph">Product</div>`;
      return `<a class="tile" href="${esc(p.url)}" target="_blank" rel="noopener">${pic}<b>${esc(p.name)}</b>${p.price ? `<small>${esc(p.price)}</small>` : ""}</a>`;
    }).join("");
    fold.hidden = !items.length;

    shopsBox.innerHTML = shops.map(s =>
      `<a class="btn o" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`
    ).join("");
    shopsBox.hidden = !shops.length;
    document.getElementById("merch").hidden = false;

    // foldable: first row + a faded peek of the next row
    let open = false;
    const PEEK = 56;
    const measure = () => {
      const tiles = [...grid.children];
      if (!tiles.length) return;
      const rects = tiles.map(t => t.getBoundingClientRect());
      const gridTop = grid.getBoundingClientRect().top;
      const firstRow = rects.filter(x => Math.abs(x.top - rects[0].top) < 2);
      const rowEnd = Math.max(...firstRow.map(x => x.bottom)) - gridTop;
      const gap = parseFloat(getComputedStyle(grid).rowGap) || 14;
      const full = grid.scrollHeight;
      const peek = Math.min(rowEnd + gap + PEEK, full);
      const needsFold = full > peek + 24;
      toggle.hidden = !needsFold;
      fold.classList.toggle("open", open || !needsFold);
      grid.style.maxHeight = (needsFold && !open ? peek : full) + "px";
      label.textContent = open ? "Show less" : "Show more";
    };
    const setOpen = v => { open = v; toggle.setAttribute("aria-expanded", open); measure(); };
    toggle.addEventListener("click", () => {
      setOpen(!open);
      if (!open) document.getElementById("merch").scrollIntoView({ block: "nearest", behavior: "smooth" });
    });
    grid.addEventListener("focusin", () => { if (!open && !toggle.hidden) setOpen(true); });
    addEventListener("resize", measure);
    if (document.fonts) document.fonts.ready.then(measure);
    measure();
  } catch (err) {}
})();
</script>

<!-- ===== PRESS (config/press.json) ===== -->
<section class="card" id="press"><h2>Press</h2>
  <ul class="list" id="press-list"><li>Loading…</li></ul>
</section>
<script>
(async () => {
  const list = document.getElementById("press-list");
  try {
    const r = await fetch("config/press.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    const items = (await r.json()).sort((a, b) => (b.year || 0) - (a.year || 0));
    if (!items.length) { list.innerHTML = '<li class="m">No press yet.</li>'; return; }
    list.innerHTML = items.map(p => {
      const meta = [p.year, p.lang].filter(Boolean).join(", ");
      return `<li><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}${meta ? ` (${esc(meta)})` : ""}</a><span>↗</span></li>`;
    }).join("");
  } catch (err) {
    list.innerHTML = '<li class="m">Couldn\'t load press right now.</li>';
  }
})();
</script>

<!-- floating chip nav + burger menu -->
<script>
(() => {
  const items = [["news","News"],["shows","Shows"],["music","Music"],["merch","Merch"],["videos","Videos"],["press","Press"],["contact","Booking"]];

  // ---- bottom chip bar ----
  const nav = document.createElement("nav");
  nav.className = "jump";
  nav.setAttribute("aria-label", "Jump to section");
  nav.innerHTML = '<a href="#" data-top aria-label="Back to top">↑ Top</a>' +
    items.map(([id, l]) => `<a href="#${id}" data-id="${id}">${l}</a>`).join("");
  document.body.appendChild(nav);

  const hero = document.querySelector(".hero");
  const chips = [...nav.querySelectorAll("[data-id]")];
  const secs = items.map(([id]) => document.getElementById(id));
  let last = null, ticking = false;

  const sync = () => chips.forEach(a => { a.hidden = document.getElementById(a.dataset.id).hidden; });
  new MutationObserver(sync).observe(document.querySelector("main"), { attributes: true, attributeFilter: ["hidden"], subtree: true });
  sync();

  nav.querySelector("[data-top]").addEventListener("click", e => {
    e.preventDefault();
    scrollTo({ top: 0, behavior: "smooth" });
  });

  const update = () => {
    ticking = false;
    nav.classList.toggle("on", hero.getBoundingClientRect().bottom < 0);
    let cur = null;
    secs.forEach(s => { if (!s.hidden && s.getBoundingClientRect().top <= innerHeight * 0.4) cur = s.id; });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) {
      const vis = secs.filter(s => !s.hidden);
      if (vis.length) cur = vis[vis.length - 1].id;
    }
    if (cur === last) return;
    last = cur;
    chips.forEach(a => {
      const on = a.dataset.id === cur;
      a.classList.toggle("act", on);
      if (on) nav.scrollTo({ left: a.offsetLeft - nav.clientWidth / 2 + a.offsetWidth / 2, behavior: "smooth" });
    });
  };
  const req = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
  addEventListener("scroll", req, { passive: true });
  addEventListener("resize", req);
  update();

  // ---- burger menu ----
  const btn = document.createElement("button");
  btn.className = "burger";
  btn.type = "button";
  btn.setAttribute("aria-label", "Menu");
  btn.setAttribute("aria-expanded", "false");
  btn.setAttribute("aria-controls", "site-menu");
  btn.innerHTML = "<span></span><span></span><span></span>";

  const menu = document.createElement("nav");
  menu.className = "menu";
  menu.id = "site-menu";
  menu.setAttribute("aria-label", "Sections");
  document.body.append(btn, menu);

  const build = () => {
    menu.innerHTML = items
      .filter(([id]) => { const s = document.getElementById(id); return s && !s.hidden; })
      .map(([id, l]) => `<a href="#${id}">${l}</a>`).join("");
  };
  const setOpen = v => {
    if (v) build();
    menu.classList.toggle("open", v);
    btn.setAttribute("aria-expanded", v);
  };
  btn.addEventListener("click", () => setOpen(btn.getAttribute("aria-expanded") !== "true"));
  menu.addEventListener("click", e => { if (e.target.closest("a")) setOpen(false); });
  document.addEventListener("click", e => {
    if (!menu.contains(e.target) && !btn.contains(e.target)) setOpen(false);
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && menu.classList.contains("open")) { setOpen(false); btn.focus(); }
  });
})();
</script>
